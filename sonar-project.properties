# SonarCloud — configuração do projeto
#
# Este é um site estático (Astro) com i18n: o conteúdo é intencionalmente
# triplicado por idioma (pt-BR / en / es), e as rotas por locale são quase
# idênticas por design. O Quality Gate padrão trata essa repetição como
# "duplicação", o que é um falso-positivo neste projeto.

sonar.projectKey=Gtvnv_gtvnv.github.io2
sonar.organization=gtvnv

# Fontes analisadas
sonar.sources=src,tools

# --- Exclusões de DUPLICAÇÃO (não de análise) ---
# Conteúdo i18n e rotas por locale repetem estrutura por natureza; a ferramenta
# de currículo (tools/resume) repete o mesmo objeto nos 3 idiomas.
sonar.cpd.exclusions=\
  src/content/**,\
  src/pages/**,\
  src/i18n/**,\
  tools/resume/data.mjs

# --- Exclusões de ANÁLISE ---
# Artefatos gerados e saídas de build não são código-fonte do produto.
sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  **/*.min.*,\
  tools/resume/.build/**,\
  tools/resume/.verify/**

# tools/resume/build.mjs usa execução de processo (Chrome headless) por design:
# é uma ferramenta de build LOCAL, não código que roda no site publicado.
# O hotspot de "command injection" aqui é falso-positivo (sem entrada de usuário).
