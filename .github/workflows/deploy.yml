name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Padrão mínimo no nível do workflow; cada job pede só o que precisa.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22: uma dependência transitiva (undici@8) exige >=22.19.0,
          # e o npm ci falhava em Node 20. Astro 5 suporta Node 22.
          node-version: 22
          cache: npm
      # npm ci: instalação reprodutível travada no lock. O lock é determinístico
      # porque @types/node está fixado via "overrides" no package.json (antes
      # resolvia versões diferentes entre máquinas e quebrava o npm ci).
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Escrita no Pages e token OIDC só neste job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
