name: CI

# Valida instalação, build e testes em cada PR para a main — assim um lock
# inconsistente ou conflito de dependência é pego ANTES do merge, não só no
# deploy pós-merge. Não publica nada.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
