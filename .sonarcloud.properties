# Configuração da ANÁLISE AUTOMÁTICA do SonarQube Cloud.
#
# Este é o arquivo que a análise automática lê (e só vale na branch padrão).
# O sonar-project.properties é ignorado por ela — por isso foi removido.
# Docs: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis

# Exclusões de detecção de duplicação (copy-paste).
# tools/resume/data.mjs repete a mesma estrutura nos 3 idiomas (pt/en/es) por
# design: o currículo é gerado a partir dele, uma entrada por idioma. Isso não é
# código duplicado a refatorar, mas conteúdo traduzido em paralelo.
sonar.cpd.exclusions=tools/resume/data.mjs
