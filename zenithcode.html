<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenithCode OS / Z2A — Gustavo Vianna</title>
  <meta
    name="description"
    content="Governança determinística de IA no ciclo de desenvolvimento: a pesquisa por trás do meta-framework pessoal Z2A."
  />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Gustavo Vianna" />
  <meta property="og:title" content="ZenithCode OS / Z2A — Gustavo Vianna" />
  <meta property="og:description" content="Governança determinística de IA no ciclo de desenvolvimento de software." />
  <meta property="og:image" content="https://gtvnv.github.io/assets/og-image.png" />
  <meta property="og:url" content="https://gtvnv.github.io/zenithcode.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ZenithCode OS / Z2A — Gustavo Vianna" />
  <meta name="twitter:image" content="https://gtvnv.github.io/assets/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/zenithcode.css" />
  <noscript>
    <style>
      .zc-hero { opacity: 1 !important; }
    </style>
  </noscript>
</head>
<body>
  <div class="lava-bg" aria-hidden="true">
    <span class="lava-blob lava-blob-1"></span>
    <span class="lava-blob lava-blob-2"></span>
    <span class="lava-blob lava-blob-3"></span>
    <span class="lava-blob lava-blob-4"></span>
  </div>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">
        <span class="dot"></span>
        <span data-name>Gustavo Vianna</span>
      </a>

      <div class="nav-wrap">
        <a href="index.html#projetos" class="zc-back" data-back-label>← Portfólio</a>

        <div class="lang-switch" role="group" aria-label="Idioma / Language / Idioma">
          <button type="button" data-lang="pt-BR">PT</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="es">ES</button>
        </div>
      </div>
    </div>
  </header>

  <main id="top">
    <div class="container">
      <!-- ============ HERO ============ -->
      <section class="zc-hero" data-zc-hero>
        <span class="zc-eyebrow"><span class="dot"></span><span data-zc-eyebrow></span></span>
        <h1 data-zc-title></h1>
        <p class="zc-subtitle" data-zc-subtitle></p>
        <p class="zc-summary" data-zc-summary></p>
        <p class="zc-masters-note" data-zc-masters-note></p>
      </section>

      <!-- ============ ESTATUTO EPISTÊMICO ============ -->
      <div class="zc-callout" data-reveal>
        <h2 data-zc-epistemic-title></h2>
        <p data-zc-epistemic-body></p>
      </div>

      <!-- ============ O PROBLEMA ============ -->
      <section class="zc-section" data-reveal>
        <div class="section-head">
          <h2 class="section-title" data-zc-problem-title></h2>
        </div>
        <p data-zc-problem-body></p>
      </section>

      <!-- ============ TESE CENTRAL ============ -->
      <section class="zc-section" data-reveal>
        <div class="section-head">
          <h2 class="section-title" data-zc-thesis-title></h2>
        </div>
        <p class="zc-quote" data-zc-thesis-quote></p>
        <p data-zc-thesis-body></p>
        <p class="zc-analogy" data-zc-thesis-analogy></p>
      </section>

      <!-- ============ NÚCLEO MÍNIMO ============ -->
      <section class="zc-section" data-reveal>
        <div class="section-head">
          <h2 class="section-title" data-zc-rules-title></h2>
        </div>
        <p class="zc-rules-intro" data-zc-rules-intro></p>
        <div class="zc-rules-grid" data-zc-rules-grid></div>
      </section>

      <!-- ============ TESTE DO APAGÃO ============ -->
      <section class="zc-section" data-reveal>
        <div class="zc-blackout">
          <span class="zc-blackout-tag" data-zc-blackout-tag></span>
          <h2 data-zc-blackout-title></h2>
          <dl>
            <div>
              <dt>O que é</dt>
              <dd data-zc-blackout-whatis></dd>
            </div>
            <div>
              <dt>Critério</dt>
              <dd data-zc-blackout-criterion></dd>
            </div>
            <div>
              <dt>O que prova</dt>
              <dd data-zc-blackout-proves></dd>
            </div>
          </dl>
          <p class="zc-blackout-closing" data-zc-blackout-closing></p>
        </div>
      </section>

      <!-- ============ COMO SE MEDE ============ -->
      <section class="zc-section" data-reveal>
        <div class="section-head">
          <h2 class="section-title" data-zc-measure-title></h2>
        </div>
        <p class="zc-measure-intro" data-zc-measure-intro></p>
        <div class="zc-measure-list" data-zc-measure-list></div>
      </section>

      <!-- ============ OS 14 SATÉLITES ============ -->
      <section class="zc-section" data-reveal>
        <div class="section-head">
          <h2 class="section-title" data-zc-satellites-title></h2>
        </div>
        <p class="zc-satellites-intro" data-zc-satellites-intro></p>
        <div class="zc-satellites-grid" data-zc-satellites-grid></div>
      </section>

      <!-- ============ QUANDO NÃO ADOTAR ============ -->
      <section class="zc-section" data-reveal>
        <div class="section-head">
          <h2 class="section-title" data-zc-whennot-title></h2>
        </div>
        <ul class="zc-when-not" data-zc-whennot-list></ul>
      </section>

      <!-- ============ CTA FINAL ============ -->
      <div class="zc-footer-cta" data-reveal>
        <p data-zc-vertex-note></p>
        <a href="index.html#projetos" class="btn btn-ghost" data-zc-back-cta></a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-year>2026</span> <span data-name>Gustavo Vianna</span></span>
      <span data-footer-note>Construído com HTML, CSS e JS puro</span>
    </div>
  </footer>

  <button class="back-to-top" data-back-to-top aria-label="Voltar ao topo" title="Voltar ao topo">↑</button>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/zenithcode-data.js"></script>
  <script src="js/zenithcode.js"></script>
</body>
</html>
